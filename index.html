<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 MC多人地图投票</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 30px 0;
        }

        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: #8892b0;
            font-size: 1.1em;
        }

        .vote-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .category-title {
            font-size: 1.3em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid;
        }

        .category-title.shooting { border-color: #ff6b6b; }
        .category-title.team { border-color: #ffd93d; }
        .category-title.party { border-color: #6bcb77; }
        .category-title.parkour { border-color: #4d96ff; }

        .map-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .map-card:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .map-card.selected {
            border-color: #00d2ff;
            background: rgba(0, 210, 255, 0.1);
        }

        .map-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .map-card input[type="checkbox"] {
            display: none;
        }

        .checkbox-custom {
            width: 28px;
            height: 28px;
            min-width: 28px;
            border-radius: 8px;
            border: 2px solid #4a5568;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        .map-card.selected .checkbox-custom {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            border-color: transparent;
        }

        .checkbox-custom::after {
            content: '✓';
            color: white;
            font-size: 16px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .map-card.selected .checkbox-custom::after {
            opacity: 1;
        }

        .map-info {
            flex: 1;
        }

        .map-name {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
        }

        .map-name .name-zh {
            margin-right: 10px;
        }

        .map-name .name-en {
            color: #8892b0;
            font-size: 0.85em;
        }

        .map-desc {
            color: #a0aec0;
            font-size: 0.95em;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .map-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .meta-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            color: #cbd5e0;
        }

        .meta-item.players {
            background: rgba(0, 210, 255, 0.2);
            color: #00d2ff;
        }

        .meta-item.version {
            background: rgba(107, 203, 119, 0.2);
            color: #6bcb77;
        }

        .meta-item.video {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            cursor: pointer;
            text-decoration: none;
        }

        .meta-item.video:hover {
            background: rgba(255, 107, 107, 0.3);
        }

        .submit-section {
            text-align: center;
            padding: 30px 0;
        }

        .random-btn {
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .random-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
        }

        .submit-btn {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.2em;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .submit-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .name-input {
            width: 100%;
            max-width: 300px;
            padding: 15px 20px;
            font-size: 1em;
            border-radius: 25px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            margin-bottom: 20px;
            text-align: center;
        }

        .name-input::placeholder {
            color: #8892b0;
        }

        .name-input:focus {
            outline: none;
            border-color: #00d2ff;
        }

        /* 结果页面 */
        .result-container {
            display: none;
        }

        .result-header {
            text-align: center;
            padding: 30px 0;
        }

        .result-header h2 {
            font-size: 2em;
            background: linear-gradient(90deg, #6bcb77, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .rank {
            font-size: 2em;
            font-weight: bold;
            min-width: 50px;
            text-align: center;
        }

        .rank.gold { color: #ffd700; }
        .rank.silver { color: #c0c0c0; }
        .rank.bronze { color: #cd7f32; }

        .result-info {
            flex: 1;
        }

        .result-name {
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .vote-bar {
            height: 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .vote-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            border-radius: 15px;
            transition: width 1s ease;
            display: flex;
            align-items: center;
            padding-right: 10px;
            justify-content: flex-end;
            min-width: 60px;
        }

        .vote-count {
            font-size: 0.9em;
            font-weight: bold;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .copy-btn {
            background: linear-gradient(135deg, #6bcb77, #4ecdc4);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: 15px;
        }

        .copy-btn:hover {
            transform: scale(1.05);
        }

        .voters-list {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }

        .voters-list h3 {
            margin-bottom: 15px;
            color: #00d2ff;
        }

        .voter-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .voter-item:last-child {
            border-bottom: none;
        }

        .voter-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .voter-maps {
            color: #a0aec0;
            font-size: 0.9em;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            display: none;
            z-index: 1000;
        }

        .instructions {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
        }

        .instructions p {
            color: #ffd93d;
            font-size: 1em;
        }

        .played-toggle {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid rgba(255, 107, 107, 0.4);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .played-toggle label {
            color: #ff6b6b;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .played-toggle input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .map-card.played {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: rgba(255, 0, 0, 0.3);
            background: rgba(255, 0, 0, 0.05);
        }

        .map-card.played::after {
            content: '❌ 已游玩';
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            z-index: 10;
        }

        .map-card {
            position: relative;
        }

        .played-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(255, 107, 107, 0.3);
            border: 1px solid rgba(255, 107, 107, 0.5);
            color: #ff6b6b;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75em;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 5;
        }

        .played-btn:hover {
            background: rgba(255, 107, 107, 0.5);
        }

        .map-card.played .played-btn {
            background: rgba(107, 203, 119, 0.3);
            border-color: rgba(107, 203, 119, 0.5);
            color: #6bcb77;
        }

        /* ===== 地图管理页样式 ===== */
        .admin-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #8892b0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 18px;
            font-size: 0.9em;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .admin-form {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .admin-form h3 {
            color: #00d2ff;
            margin-bottom: 20px;
            font-size: 1.2em;
        }

        .admin-form .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .admin-form .form-group {
            flex: 1;
            min-width: 200px;
        }

        .admin-form .form-group label {
            display: block;
            color: #8892b0;
            font-size: 0.9em;
            margin-bottom: 6px;
        }

        .admin-form .form-group input,
        .admin-form .form-group select,
        .admin-form .form-group textarea {
            width: 100%;
            padding: 10px 15px;
            font-size: 0.95em;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-family: inherit;
        }

        .admin-form .form-group input:focus,
        .admin-form .form-group select:focus,
        .admin-form .form-group textarea:focus {
            outline: none;
            border-color: #00d2ff;
        }

        .admin-form .form-group select option {
            background: #16213e;
            color: white;
        }

        .admin-form .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .admin-form .form-group input::placeholder,
        .admin-form .form-group textarea::placeholder {
            color: #8892b0;
        }

        .admin-add-btn {
            background: linear-gradient(135deg, #6bcb77, #4ecdc4);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            margin-top: 10px;
        }

        .admin-add-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(107, 203, 119, 0.3);
        }

        .admin-map-list {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .admin-map-list h3 {
            color: #00d2ff;
            margin-bottom: 20px;
            font-size: 1.2em;
        }

        .admin-map-category {
            margin-bottom: 20px;
        }

        .admin-map-category h4 {
            color: #ffd93d;
            margin-bottom: 10px;
            font-size: 1em;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .admin-map-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 8px;
            gap: 10px;
        }

        .admin-map-item .map-item-info {
            flex: 1;
            min-width: 0;
        }

        .admin-map-item .map-item-name {
            font-weight: bold;
            font-size: 0.95em;
        }

        .admin-map-item .map-item-id {
            color: #8892b0;
            font-size: 0.8em;
            font-family: monospace;
        }

        .admin-delete-btn {
            background: rgba(255, 107, 107, 0.3);
            border: 1px solid rgba(255, 107, 107, 0.5);
            color: #ff6b6b;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .admin-delete-btn:hover {
            background: rgba(255, 107, 107, 0.5);
        }

        .admin-back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .admin-back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: #8892b0;
            font-size: 1.1em;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }

            .map-meta {
                gap: 8px;
            }

            .meta-item {
                font-size: 0.8em;
                padding: 4px 10px;
            }

            .admin-form .form-row {
                flex-direction: column;
            }

            .admin-form .form-group {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="voteContainer">
        <div class="header">
            <h1>🎮 MC多人地图投票</h1>
            <p>选出你想和朋友们一起玩的地图！（可多选）</p>
        </div>

        <div style="text-align: right; margin-bottom: 15px;">
            <button class="admin-btn" onclick="showAdminPage()">⚙️ 地图管理</button>
        </div>

        <div class="instructions">
            <p>📢 每人最多选择 <strong>5张</strong> 地图，点击"提交投票"即可完成！（同一昵称不可重复投票）</p>
        </div>

        <div class="played-toggle">
            <label>
                <input type="checkbox" id="hidePlayed" onchange="togglePlayedMaps()">
                🔴 隐藏已游玩过的地图
            </label>
            <span style="color: #8892b0; font-size: 0.9em;">勾选后已游玩的地图将被隐藏</span>
        </div>

        <div class="played-toggle" style="margin-top: 10px;">
            <label style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span style="font-size:1.1em;">👥</span>
                <span>按人数筛选：</span>
                <select id="playerFilter" onchange="filterByPlayers()" style="background:#16213e;color:#ccd6f6;border:1px solid #233554;border-radius:8px;padding:6px 12px;font-size:0.9em;">
                    <option value="0">不限人数</option>
                    <option value="2">2人</option>
                    <option value="3">3人</option>
                    <option value="4">4人</option>
                    <option value="5">5人</option>
                    <option value="6">6人</option>
                    <option value="8">8人</option>
                    <option value="10">10人</option>
                    <option value="12">12人</option>
                    <option value="16">16人</option>
                    <option value="20">20人</option>
                </select>
                <span id="playerFilterHint" style="color:#8892b0;font-size:0.85em;"></span>
            </label>
        </div>

        <input type="text" class="name-input" id="playerName" placeholder="输入你的昵称" maxlength="20">

        <!-- 动态地图网格 -->
        <div id="mapGrid">
            <div class="loading-spinner">⏳ 正在加载地图数据...</div>
        </div>

        <div class="submit-section">
            <button class="random-btn" onclick="randomSelect()">🎲 随机选择5张（选择困难专用）</button>
            <br><br>
            <button class="submit-btn" onclick="submitVote()">🗳️ 提交投票</button>
            <br><br>
            <button class="back-btn" onclick="showResultsPage()">📊 查看实时投票结果</button>
        </div>
    </div>

    <!-- 结果/汇总页面（动态生成内容） -->
    <div class="container result-container" id="resultContainer"></div>

    <!-- 地图管理页面 -->
    <div class="container result-container" id="adminContainer"></div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // ⚙️ 配置区域 - 请先完成以下设置再部署！
        // ============================================================
        const CONFIG = {

        // ============================================================

        // ---- 分类元数据 ----
        const CATEGORY_META = {

            '团队对抗': { icon: '🎯', cssClass: 'team', title: '团队对抗类' },

            '冒险/探索': { icon: '🗡️', borderColor: '#e67e22', title: '冒险/探索类' },
            '建筑比赛': { icon: '🏗️', borderColor: '#1abc9c', title: '建筑比赛类' },
            '友尽小游戏': { icon: '💀', borderColor: '#e74c3c', title: '友尽小游戏类' },
            '友尽假期': { icon: '🏖️', borderColor: '#f39c12', title: '友尽假期类' },
            '多人对抗': { icon: '⚔️', borderColor: '#2ecc71', title: '多人对抗类' }

        // ---- 默认地图数据（内置地图）----
        const DEFAULT_MAPS = {

        // ---- 运行时地图数据（从 JSONBin 加载并合并）----
        let currentMapData = {};

        // ---- JSONBin API 工具函数 ----
        async function fetchAllData() {
            try {
                const resp = await fetch(`${CONFIG.apiUrl}/b/${CONFIG.binId}/latest`, {
                    headers: { 'X-Access-Key': CONFIG.apiKey }
                });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                return data.record;
            } catch (e) {
                console.error('获取数据失败:', e);
                return null;
            }
        }

        async function fetchVotes() {
            try {
                const allData = await fetchAllData();
                if (!allData) return null;
                return allData.votes || [];
            } catch (e) {
                console.error('获取投票失败:', e);
                return null;
            }
        }

        async function saveVote(voteObj) {
            try {
                const allData = await fetchAllData();
                if (!allData) throw new Error('无法读取数据');

                const votes = allData.votes || [];
                const maps = allData.maps || null;

                // 检查是否已投票（同名不能重复投）
                if (votes.some(v => v.name === voteObj.name)) {
                    return { ok: false, reason: 'duplicate' };
                }

                votes.push(voteObj);

                // 写回
                const resp = await fetch(`${CONFIG.apiUrl}/b/${CONFIG.binId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Access-Key': CONFIG.apiKey
                    },
                    body: JSON.stringify({ votes, maps })
                });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                return { ok: true };
            } catch (e) {
                console.error('保存投票失败:', e);
                return { ok: false, reason: 'network' };
            }
        }

        // ---- 地图数据加载与合并 ----
        async function loadMapData() {
            const allData = await fetchAllData();
            if (!allData) {
                // 加载失败，使用默认地图
                currentMapData = JSON.parse(JSON.stringify(DEFAULT_MAPS));
                return;
            }

            // 合并：默认地图 + 云端自定义地图（云端覆盖同ID的默认地图）
            const merged = JSON.parse(JSON.stringify(DEFAULT_MAPS));
            const cloudMaps = allData.maps || {};

            for (const [id, data] of Object.entries(cloudMaps)) {
                merged[id] = data;
            }

            // 按 order 排序（先收集，再排序后重建对象）
            const sorted = Object.entries(merged).sort((a, b) => (a[1].order || 9999) - (b[1].order || 9999));
            currentMapData = {};
            for (const [id, data] of sorted) {
                currentMapData[id] = data;
            }
        }

        async function saveMapData(newMapData) {
            try {
                const allData = await fetchAllData();
                const votes = (allData && allData.votes) || [];

                const resp = await fetch(`${CONFIG.apiUrl}/b/${CONFIG.binId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Access-Key': CONFIG.apiKey
                    },
                    body: JSON.stringify({ votes, maps: newMapData })
                });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                return true;
            } catch (e) {
                console.error('保存地图数据失败:', e);
                return false;
            }
        }

        // ---- 动态渲染地图 ----
        function renderMapGrid() {
            const grid = document.getElementById('mapGrid');
            if (!grid) return;

            // 按分类分组
            const categories = {};
            for (const [id, data] of Object.entries(currentMapData)) {
                const cat = data.category || '其他';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push({ id, ...data });
            }

            // 获取分类出现顺序（按order排列的首次出现）
            const catOrder = [];
            for (const [id, data] of Object.entries(currentMapData)) {
                const cat = data.category || '其他';
                if (!catOrder.includes(cat)) catOrder.push(cat);
            }

            let html = '';
            for (const cat of catOrder) {
                const meta = CATEGORY_META[cat] || { icon: '📁', title: cat + '类' };
                const borderStyle = meta.borderColor
                    ? `style="border-color: ${meta.borderColor};"`
                    : '';

                html += `<div class="vote-section">`;
                html += `<h2 class="category-title ${meta.cssClass || ''}" ${borderStyle}>${meta.icon} ${meta.title}</h2>`;

                for (const map of categories[cat]) {
                    html += renderMapCard(map);
                }

                html += `</div>`;
            }

            grid.innerHTML = html;

            // 渲染后重新应用状态
            updatePlayedStates();
            addPlayedButtons();
        }

        function renderMapCard(map) {
            const videoHtml = map.videoUrl
                ? `<a class="meta-item video" href="${escapeHtml(map.videoUrl)}" target="_blank" onclick="event.stopPropagation()">🎬 视频</a>`
                : '';

            return `
                <div class="map-card" data-map="${escapeHtml(map.id)}" onclick="toggleSelect(this)">
                    <div class="checkbox-custom"></div>
                    <div class="map-info">
                        <div class="map-name">
                            <span class="name-zh">${escapeHtml(map.name)}</span>
                            <span class="name-en">${escapeHtml(map.nameEn || '')}</span>
                        </div>
                        <div class="map-desc">${escapeHtml(map.desc || '')}</div>
                        <div class="map-meta">
                            <span class="meta-item players">${escapeHtml(map.players || '👥 多人')}</span>
                            <span class="meta-item version">${escapeHtml(map.version || '📦 最新版')}</span>
                            ${videoHtml}
                        </div>
                    </div>
                </div>`;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ---- 简化的 mapData 兼容对象（供结果页面使用）----
        function getMapLookup() {
            const lookup = {};
            for (const [id, data] of Object.entries(currentMapData)) {
                lookup[id] = { name: data.name, category: data.category };
            }
            return lookup;
        }

        // ---- 选择逻辑 ----
        function toggleSelect(card) {
            if (card.classList.contains('disabled') || card.classList.contains('played')) return;
            const selected = document.querySelectorAll('.map-card.selected');
            if (card.classList.contains('selected')) {
                card.classList.remove('selected');
            } else {
                if (selected.length >= 5) {
                    showToast('每人最多只能选5张地图哦！用🎲随机选择按钮自动选5张吧');
                    return;
                }
                card.classList.add('selected');
            }
            updateCardStates();
        }

        function updateCardStates() {
            const selected = document.querySelectorAll('.map-card.selected');
            const allCards = document.querySelectorAll('.map-card');
            allCards.forEach(card => {
                if (!card.classList.contains('selected') && selected.length >= 5) {
                    card.classList.add('disabled');
                } else {
                    card.classList.remove('disabled');
                }
            });
        }

        // ---- 提交投票 ----
        async function submitVote() {
            const name = document.getElementById('playerName').value.trim();
            if (!name) { showToast('请输入你的昵称！'); return; }

            const selected = document.querySelectorAll('.map-card.selected');
            if (selected.length === 0) { showToast('请至少选择一张地图！'); return; }

            const btn = document.querySelector('.submit-btn');
            btn.disabled = true;
            btn.textContent = '⏳ 提交中...';

            const selectedMaps = Array.from(selected).map(c => c.dataset.map);
            const voteObj = { name, maps: selectedMaps, time: new Date().toISOString() };

            const result = await saveVote(voteObj);
            btn.disabled = false;
            btn.textContent = '🗳️ 提交投票';

            const mapLookup = getMapLookup();

            if (result.ok) {
                showVoteSuccess(name, selectedMaps, mapLookup);
            } else if (result.reason === 'duplicate') {
                showToast('⚠️ 该昵称已投过票，请换个名字！');
            } else {
                showToast('❌ 提交失败，请检查网络后重试');
            }
        }

        function showVoteSuccess(name, maps, mapLookup) {
            document.getElementById('voteContainer').style.display = 'none';
            const rc = document.getElementById('resultContainer');
            rc.style.display = 'block';
            rc.innerHTML = `
                <div class="result-header">
                    <h2>✅ 投票成功！</h2>
                </div>
                <div class="vote-section" style="text-align: center;">
                    <h3 style="margin-bottom: 20px; color: #00d2ff;">👤 ${escapeHtml(name)} 的投票</h3>
                    <div style="margin-bottom: 25px;">
                        <p style="color: #8892b0; margin-bottom: 10px;">你选择了：</p>
                        ${maps.map(id => '<span style="background: rgba(0,210,255,0.2); padding: 8px 15px; border-radius: 20px; margin: 5px; display: inline-block;">' + escapeHtml((mapLookup[id] && mapLookup[id].name) || id) + '</span>').join('')}
                    </div>
                    <p style="color: #6bcb77; margin-bottom: 20px;">🎉 投票已记录，等待主持人公布结果！</p>
                    <button class="submit-btn" onclick="showResultsPage()" style="margin-right: 15px;">📊 查看实时投票结果</button>
                    <button class="back-btn" onclick="location.reload()">返回重新投票</button>
                </div>
            `;
        }

        // ---- 实时结果页面 ----
        async function showResultsPage() {
            document.getElementById('voteContainer').style.display = 'none';
            document.getElementById('adminContainer').style.display = 'none';
            const rc = document.getElementById('resultContainer');
            rc.style.display = 'block';
            rc.innerHTML = '<div class="result-header"><h2>⏳ 加载中...</h2></div>';

            const votes = await fetchVotes();
            if (votes === null) {
                rc.innerHTML = '<div class="result-header"><h2>❌ 加载失败，请刷新重试</h2></div>';
                return;
            }
            renderResults(votes, rc);
        }

        function renderResults(votes, container) {
            const voteCounts = {};
            votes.forEach(v => {
                v.maps.forEach(mapId => {
                    voteCounts[mapId] = (voteCounts[mapId] || 0) + 1;
                });
            });

            const sorted = Object.entries(voteCounts).sort((a, b) => b[1] - a[1]);
            const maxVotes = sorted.length > 0 ? sorted[0][1] : 1;
            const mapLookup = getMapLookup();

            container.innerHTML = `
                <div class="result-header">
                    <h2>📊 实时投票结果</h2>
                    <p style="color: #8892b0; margin-top: 10px;">共 ${votes.length} 人参与投票</p>
                </div>
                <div class="vote-section">
                    ${sorted.map(([mapId, count]) => {
                        const idx = sorted.indexOf(sorted.find(s => s[0] === mapId));
                        const rankClass = idx === 0 ? 'gold' : idx === 1 ? 'silver' : idx === 2 ? 'bronze' : '';
                        const rankEmoji = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '#' + (idx + 1);
                        const pct = (count / maxVotes * 100).toFixed(0);
                        const mapName = (mapLookup[mapId] && mapLookup[mapId].name) || mapId;
                        const mapCat = (mapLookup[mapId] && mapLookup[mapId].category) || '未知';
                        return '<div class="result-card"><div class="rank ' + rankClass + '">' + rankEmoji + '</div><div class="result-info"><div class="result-name">' + escapeHtml(mapName) + ' <span style="color:#8892b0;font-size:0.85em;">(' + escapeHtml(mapCat) + ')</span></div><div class="vote-bar"><div class="vote-fill" style="width:' + pct + '%"><span class="vote-count">' + count + '票</span></div></div></div></div>';
                    }).join('')}

                    <div class="voters-list" style="margin-top: 25px;">
                        <h3>👥 投票详情</h3>
                        ${votes.map(v => '<div class="voter-item"><div class="voter-name">👤 ' + escapeHtml(v.name) + '</div><div class="voter-maps">选择了：' + v.maps.map(id => escapeHtml((mapLookup[id] && mapLookup[id].name) || id)).join('、') + '</div></div>').join('')}
                    </div>

                    <div style="text-align: center; margin-top: 25px;">
                        <button class="copy-btn" onclick="copyResults(${JSON.stringify(sorted).replace(/\"/g, '&quot;')}, ${votes.length})">📋 复制结果</button>
                        <button class="back-btn" onclick="location.reload()" style="margin-left: 15px;">返回</button>
                        <button class="random-btn" onclick="clearAllVotes()" style="margin-left: 15px; font-size: 0.9em; padding: 12px 25px;">🗑️ 清空所有投票</button>
                    </div>
                </div>
            `;
        }

        function copyResults(sorted, total) {
            const mapLookup = getMapLookup();
            let text = '🎮 MC多人地图投票结果\n========================\n共 ' + total + ' 人参与投票\n\n';
            sorted.forEach(([mapId, count], i) => {
                const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1) + '.';
                const name = (mapLookup[mapId] && mapLookup[mapId].name) || mapId;
                text += medal + ' ' + name + ' - ' + count + '票\n';
            });
            navigator.clipboard.writeText(text).then(() => showToast('结果已复制！'));
        }

        // ---- 已游玩地图管理 (仅本地) ----
        const playedMapsKey = 'mcMapPlayed';
        function getPlayedMaps() { return JSON.parse(localStorage.getItem(playedMapsKey) || '[]'); }

        function togglePlayedMaps() {
            const hide = document.getElementById('hidePlayed').checked;
            const played = getPlayedMaps();
            document.querySelectorAll('.map-card').forEach(card => {
                card.style.display = (hide && played.includes(card.dataset.map)) ? 'none' : '';
            });
            localStorage.setItem('mcMapHidePlayed', hide);
        }

        function toggleMapPlayed(mapId, e) {
            e.stopPropagation();
            const played = getPlayedMaps();
            const idx = played.indexOf(mapId);
            if (idx > -1) { played.splice(idx, 1); showToast('已取消标记'); }
            else { played.push(mapId); showToast('已标记为已游玩'); }
            localStorage.setItem(playedMapsKey, JSON.stringify(played));
            updatePlayedStates();
            updatePlayedButtonStates();
        }

        function updatePlayedStates() {
            const played = getPlayedMaps();
            const hide = document.getElementById('hidePlayed')?.checked;
            document.querySelectorAll('.map-card').forEach(card => {
                const m = card.dataset.map;
                if (played.includes(m)) {
                    card.classList.add('played');
                    if (hide) card.style.display = 'none';
                } else {
                    card.classList.remove('played');
                    card.style.display = '';
                }
            });
        }

        function addPlayedButtons() {
            document.querySelectorAll('.map-card').forEach(card => {
                if (!card.querySelector('.played-btn')) {
                    const btn = document.createElement('button');
                    btn.className = 'played-btn';
                    btn.textContent = '标记已游玩';
                    btn.onclick = e => toggleMapPlayed(card.dataset.map, e);
                    card.appendChild(btn);
                }
            });
            updatePlayedButtonStates();
        }

        function updatePlayedButtonStates() {
            const played = getPlayedMaps();
            document.querySelectorAll('.played-btn').forEach(btn => {
                const m = btn.closest('.map-card').dataset.map;
                btn.textContent = played.includes(m) ? '✓ 已游玩' : '标记已游玩';
            });
        }

        // ---- 随机选择 ----
        function randomSelect() {
            document.querySelectorAll('.map-card.selected').forEach(c => c.classList.remove('selected'));
            const cards = Array.from(document.querySelectorAll('.map-card'));
            // 排除已游玩的地图
            const playable = cards.filter(c => !c.classList.contains('played'));
            const shuffled = playable.sort(() => Math.random() - 0.5).slice(0, 5);
            shuffled.forEach((card, i) => {
                setTimeout(() => {
                    card.classList.add('selected');
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, i * 200);
            });
            setTimeout(() => updateCardStates(), 5 * 200 + 100);
            showToast('🎲 随机帮你选了 5 张地图！');
        }

        // ---- 清空所有投票 ----
        async function clearAllVotes() {
            if (!confirm('⚠️ 确认清空所有投票数据？此操作不可恢复！')) return;
            try {
                const allData = await fetchAllData();
                const maps = (allData && allData.maps) || null;
                const resp = await fetch(`${CONFIG.apiUrl}/b/${CONFIG.binId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Access-Key': CONFIG.apiKey
                    },
                    body: JSON.stringify({ votes: [], maps })
                });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                showToast('✅ 已清空所有投票！');
                setTimeout(() => location.reload(), 1000);
            } catch (e) {
                console.error('清空失败:', e);
                showToast('❌ 清空失败，请重试');
            }
        }

        // ---- 地图管理页面 ----
        function showAdminPage() {
            document.getElementById('voteContainer').style.display = 'none';
            document.getElementById('resultContainer').style.display = 'none';
            const ac = document.getElementById('adminContainer');
            ac.style.display = 'block';
            renderAdminPage();
        }

        function backToVote() {
            document.getElementById('adminContainer').style.display = 'none';
            document.getElementById('voteContainer').style.display = 'block';
        }

        function renderAdminPage() {
            const ac = document.getElementById('adminContainer');

            // 获取所有现有分类
            const categories = [...new Set(Object.values(currentMapData).map(m => m.category))].sort();

            // 按分类分组展示
            const grouped = {};
            for (const [id, data] of Object.entries(currentMapData)) {
                const cat = data.category || '其他';
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push({ id, ...data });
            }

            let listHtml = '';
            for (const [cat, maps] of Object.entries(grouped)) {
                const meta = CATEGORY_META[cat] || { icon: '📁' };
                listHtml += `<div class="admin-map-category">`;
                listHtml += `<h4>${meta.icon} ${escapeHtml(cat)} (${maps.length})</h4>`;
                for (const map of maps) {
                    listHtml += `
                        <div class="admin-map-item">
                            <div class="map-item-info">
                                <div class="map-item-name">${escapeHtml(map.name)} <span style="color:#8892b0;font-size:0.85em;">${escapeHtml(map.nameEn || '')}</span></div>
                                <div class="map-item-id">ID: ${escapeHtml(map.id)}</div>
                            </div>
                            <button class="admin-delete-btn" onclick="deleteMap('${escapeHtml(map.id)}')">🗑️ 删除</button>
                        </div>`;
                }
                listHtml += `</div>`;
            }

            // 构建分类下拉选项
            let catOptions = categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
            catOptions += `<option value="__custom__">➕ 自定义分类...</option>`;

            ac.innerHTML = `
                <div class="result-header">
                    <h2>⚙️ 地图管理</h2>
                    <p style="color: #8892b0; margin-top: 10px;">添加或删除地图，共 ${Object.keys(currentMapData).length} 张地图</p>
                </div>

                <div class="admin-form">
                    <h3>➕ 添加新地图</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>地图 ID（英文标识符）</label>
                            <input type="text" id="adminMapId" placeholder="例如: my_new_map" maxlength="50">
                        </div>
                        <div class="form-group">
                            <label>中文名称</label>
                            <input type="text" id="adminMapName" placeholder="例如: 我的新地图" maxlength="50">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>英文名称</label>
                            <input type="text" id="adminMapNameEn" placeholder="例如: My New Map" maxlength="100">
                        </div>
                        <div class="form-group">
                            <label>分类</label>
                            <select id="adminMapCategory" onchange="toggleCustomCategory(this)">
                                ${catOptions}
                            </select>
                        </div>
                    </div>
                    <div class="form-row" id="customCategoryRow" style="display:none;">
                        <div class="form-group">
                            <label>自定义分类名称</label>
                            <input type="text" id="adminMapCategoryCustom" placeholder="例如: 自定义分类" maxlength="20">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>描述</label>
                            <input type="text" id="adminMapDesc" placeholder="地图简要描述" maxlength="200">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>人数信息</label>
                            <input type="text" id="adminMapPlayers" placeholder="例如: 👥 2-4人" maxlength="30">
                        </div>
                        <div class="form-group">
                            <label>版本信息</label>
                            <input type="text" id="adminMapVersion" placeholder="例如: 📦 1.21" maxlength="30">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>视频链接（Bilibili等）</label>
                            <input type="text" id="adminMapVideo" placeholder="https://www.bilibili.com/video/..." maxlength="200">
                        </div>
                    </div>
                    <button class="admin-add-btn" onclick="addMap()">✅ 添加地图</button>
                </div>

                <div class="admin-map-list">
                    <h3>📋 当前地图列表</h3>
                    ${listHtml}
                </div>

                <div style="text-align: center;">
                    <button class="admin-back-btn" onclick="backToVote()">← 返回投票页</button>
                </div>
            `;
        }

        function toggleCustomCategory(select) {
            const row = document.getElementById('customCategoryRow');
            row.style.display = select.value === '__custom__' ? 'flex' : 'none';
        }

        async function addMap() {
            const id = document.getElementById('adminMapId').value.trim();
            const name = document.getElementById('adminMapName').value.trim();
            const nameEn = document.getElementById('adminMapNameEn').value.trim();
            let category = document.getElementById('adminMapCategory').value;
            const desc = document.getElementById('adminMapDesc').value.trim();
            const players = document.getElementById('adminMapPlayers').value.trim();
            const version = document.getElementById('adminMapVersion').value.trim();
            const videoUrl = document.getElementById('adminMapVideo').value.trim();

            if (!id) { showToast('请输入地图ID！'); return; }
            if (!name) { showToast('请输入中文名称！'); return; }
            if (!category || category === '__custom__') {
                category = document.getElementById('adminMapCategoryCustom').value.trim();
                if (!category) { showToast('请输入自定义分类名称！'); return; }
            }

            // 验证ID格式（只允许字母数字和下划线）
            if (!/^[a-zA-Z0-9_]+$/.test(id)) {
                showToast('地图ID只能包含英文字母、数字和下划线！');
                return;
            }

            if (currentMapData[id]) {
                showToast('⚠️ 该地图ID已存在！请使用其他ID');
                return;
            }

            // 计算新的order（取最大值+1）
            const maxOrder = Math.max(0, ...Object.values(currentMapData).map(m => m.order || 0));

            // 添加到当前数据
            currentMapData[id] = {
                name,
                nameEn: nameEn || name,
                category,
                desc: desc || '',
                players: players || '👥 多人',
                version: version || '📦 最新版',
                videoUrl: videoUrl || '',
                order: maxOrder + 1
            };

            // 保存到云端
            const ok = await saveMapData(currentMapData);
            if (ok) {
                showToast('✅ 地图添加成功！');
                renderMapGrid();
                renderAdminPage();
            } else {
                // 回滚
                delete currentMapData[id];
                showToast('❌ 保存失败，请重试');
            }
        }

        async function deleteMap(mapId) {
            if (!confirm(`⚠️ 确认删除地图 "${(currentMapData[mapId] && currentMapData[mapId].name) || mapId}"？`)) return;

            const deletedData = currentMapData[mapId];
            delete currentMapData[mapId];

            const ok = await saveMapData(currentMapData);
            if (ok) {
                showToast('✅ 地图已删除！');
                renderMapGrid();
                renderAdminPage();
            } else {
                // 回滚
                currentMapData[mapId] = deletedData;
                showToast('❌ 删除失败，请重试');
            }
        }


        // ---- 人数筛选 ----
        function filterByPlayers() {
            const count = parseInt(document.getElementById('playerFilter').value);
            const hint = document.getElementById('playerFilterHint');
            if (count === 0) {
                hint.textContent = '';
                document.querySelectorAll('.map-card').forEach(c => c.style.display = '');
                document.querySelectorAll('.vote-section').forEach(s => s.style.display = '');
                return;
            }
            hint.textContent = '筛选: ' + count + '人可玩';
            document.querySelectorAll('.map-card').forEach(card => {
                const mapId = card.getAttribute('data-map');
                const map = currentMapData[mapId];
                if (map) {
                    const min = map.playersMin || 1;
                    const max = map.playersMax || 20;
                    card.style.display = (count >= min && count <= max) ? '' : 'none';
                }
            });
            document.querySelectorAll('.vote-section').forEach(section => {
                const visibleCards = section.querySelectorAll('.map-card:not([style*="display: none"])');
                section.style.display = visibleCards.length === 0 ? 'none' : '';
            });
        }

        // ---- Toast ----
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2500);
        }

        // ---- 初始化 ----
        document.addEventListener('DOMContentLoaded', async () => {
            const hide = localStorage.getItem('mcMapHidePlayed') === 'true';
            const cb = document.getElementById('hidePlayed');
            if (cb) cb.checked = hide;

            // 加载地图数据
            await loadMapData();

            // 渲染地图
            renderMapGrid();
        });
    </script>
</body>
</html>
